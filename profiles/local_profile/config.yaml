# profiles/brando_profile/config.yaml

executor: local
jobs: 6

use-conda: true
conda-frontend: conda

use-singularity: true
singularity-args: "-B /path/to/projects/{project_name}/"

configfile: "configs/project_config.yaml"

rerun-incomplete: true
latency-wait: 60


# Defaults resourses for all rules

# -------------------------
# Resource budgeting (local)
# -------------------------
# Snakemake will use these for scheduling; threads is enforced, mem is scheduling only.
default-resources:
  mem: "24G"
  threads: 24

# Total available resources on the machine (strongly recommended if you use mem as a resource)
resources:
  mem: "1000G"
  threads: 124
  # If you have GPUs locally and want to serialize GPU jobs, set this accordingly.
  # gpu: 1

# -------------------------
# Rule-specific resources
# -------------------------
set-resources:
  basecalling:
    mem: "64G"
    # keep gpu only if your Snakefile uses it as a logical limiter
    # gpu: 1

  create_log:
    mem: "2G"

  QC_NanoP_unaligned:
    mem: "8G"

  ubam_to_fastq:
    mem: "24G"

  filter_fastq:
    mem: "16G"

  alignment:
    mem: "124G"

  QC_fastq_pre_filtering:
    mem: "24G"

  QC_fastq_post_filtering:
    mem: "24G"

  variant_calling_snps_indels:
    mem: "96G"

  variant_calling_sv:
    mem: "32G"

  longphase_modcall:
    mem: "64G"

  longphase_phase:
    mem: "124G"

  longphase_haplotag:
    mem: "24G"

  QC_phased_bam:
    mem: "24G"

  sex_from_camino:
    mem: "16G"

  methylation_calling:
    mem: "64G"

  TE_calling:
    mem: "128G"

  TR_calling:
    mem: "28G"

  TR_methylation_calling:
    mem: "28G"

  non_ref_TE_methylation_calling:
    mem: "24G"

  ref_TE_methylation_calling_cpg_res:
    mem: "32G"

  ref_TE_methylation_calling_averages:
    mem: "32G"

# -------------------------
# Rule-specific threads
# -------------------------
# With 124 threads total, your existing sizing is reasonable.
set-threads:
  basecalling: 8
  create_log: 2
  QC_NanoP_unaligned: 8
  ubam_to_fastq: 32
  filter_fastq: 24
  alignment: 44
  QC_fastq_pre_filtering: 12
  QC_fastq_post_filtering: 12
  variant_calling_snps_indels: 24
  variant_calling_sv: 16
  longphase_modcall: 16
  longphase_phase: 32
  longphase_haplotag: 32
  QC_phased_bam: 8
  sex_from_camino: 8
  methylation_calling: 16
  TE_calling: 24
  TR_calling: 16
  TR_methylation_calling: 8
  non_ref_TE_methylation_calling: 16
  ref_TE_methylation_calling_cpg_res: 16
  ref_TE_methylation_calling_averages: 24




