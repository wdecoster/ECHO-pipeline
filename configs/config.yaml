samples:
  - HG002

start_from: "ubam" #Options: "pod5", "ubam", "fastq", "bam".

input_dir: "/ifs/data/research/unique/projects/GIAB"
output_dir: "/ifs/data/research/unique/projects/GIAB"

reference: "/ifs/data/research/unique/leena/references/GRCh38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta"
reference_name: "GRCh38" #"chm13v2" or "GRCh38"
reference_TE: "/ifs/software/research/unique/leena/PIPELINE/repeatome_pipeline/repeat-catalogs/TEs/teref.ont.human.fa"

fastq_filtering:
  min_read_quality: 0
  min_read_length: 500

# small TR catalog (ideal for testing)
tr_catalog: "/ifs/software/research/unique/leena/PIPELINE/repeatome_pipeline/repeat-catalogs/TRs/GRCh38/pathogenic/STRchive-disease-loci.v2.2.1.GRCh38.longTR.bed"
type_of_tr: "pathogenic" #Modify according to TR catalog used (genome-wide, genome-wide-str, pathogenic, forensic)

# biggest TR catalog 
#tr_catalog: "/ifs/software/research/unique/leena/PIPELINE/repeatome_pipeline/repeat-catalogs/TRs/GRCh38/genome-wide/adotto_catalog_longtr.bed"
#type_of_tr: "genome-wide" #Modify according to TR catalog used (genome-wide, genome-wide-str, pathogenic, forensic)

# small TE catalog (ideal for testing)
te_catalog: "/ifs/software/research/unique/leena/PIPELINE/repeatome_pipeline/repeat-catalogs/TEs/GRCh38/TE_classes/GRCh38_TEs_retroposon.bed"
type_of_te: "retroposon" #Options: all, all_cpg, DNA, DNA_cpg, LINE, LINE_cpg, helitron, helitron_cpg, SINE, SINE_cpg, LTR, LTR_cpg, retroposon, retroposon_cpg

# biggest TE catalog
#te_catalog: "/ifs/software/research/unique/leena/PIPELINE/repeatome_pipeline/repeat-catalogs/TEs/GRCh38/GRCh39_TEs_all.bed"
#type_of_te: "all" #Options: all, all_cpg, DNA, DNA_cpg, LINE, LINE_cpg, helitron, helitron_cpg, SINE, SINE_cpg, LTR, LTR_cpg, retroposon, retroposon_cpg

flanking_length_bp: "250" #Description: flanking regions to be analysed for methylation and sequence variation
extension_repeat_consensus: "1000" #Description: number of bases to extend repeat consensus with for re-mapping

haploid_chrs: "chrM,chrX,chrY"
